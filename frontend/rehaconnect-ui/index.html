<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#126c76"><title>RehaConnect</title><link rel="stylesheet" href="style.css"></head>
<body>
<aside class="sidebar">
  <a class="brand" href="#dashboard"><span class="brand-symbol">✳</span><span>RehaConnect<small data-i18n="tagline"></small></span></a>
  <div class="workspace"><span class="workspace-icon">✚</span><div><strong data-i18n="workspace"></strong><small data-i18n="setupRequired"></small></div></div>
  <p class="nav-label" data-i18n="workspaceLabel"></p><nav id="navigation" aria-label="Main"></nav>
  <div class="sidebar-bottom"><span class="status-dot"></span><span data-i18n="setupRequired"></span></div>
</aside>
<div class="app">
  <header><span class="breadcrumb">RehaConnect <span>/</span> <strong id="breadcrumb"></strong></span><div class="header-actions"><label class="sr-only" for="language">Language / Sprache</label><select id="language"><option value="en">English</option><option value="de">Deutsch</option></select><label class="sr-only" for="view">View / Ansicht</label><select id="view"></select></div></header>
  <main id="content"></main>
  <footer><span>RehaConnect</span><span data-i18n="footer"></span></footer>
</div>
<dialog id="clinic-dialog"><form id="clinic-form"><div class="dialog-heading"><h2 data-i18n="createClinic"></h2><button type="button" id="close-dialog" class="icon-button" aria-label="Close / Schließen">×</button></div><p data-i18n="clinicIntro"></p><label><span data-i18n="clinicName"></span><input name="name" required maxlength="160" autocomplete="organization"></label><label><span data-i18n="address"></span><input name="address" required maxlength="300" autocomplete="street-address"></label><label><span data-i18n="timezone"></span><input name="timezone" required value="Europe/Berlin" maxlength="80"></label><p id="form-status" role="status" aria-live="polite"></p><button class="primary" id="save-clinic" type="submit" data-i18n="saveClinic"></button></form></dialog>
<script src="integrations.js" defer></script><script src="app.js" defer></script>
</body></html>
